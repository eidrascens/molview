<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' file: https: data: blob:; script-src 'self' file: 'unsafe-eval'; style-src 'self' file: 'unsafe-inline'; img-src 'self' file: https: data: blob:; connect-src 'self' file: https: data: blob:; worker-src 'self' blob:;">
  <title>MolView viewport</title>
  <style>
    :root, html, body {
      width: 100%; height: 100%; padding: 0; margin: 0;
      overflow: hidden; background: #fcfbf9;
    }
    #molstar-parent {
      position: absolute; inset: 0; width: 100%; height: 100%;
      padding: 0; margin: 0; overflow: hidden; background: #fcfbf9;
    }
    #molstar-canvas {
      display: block; position: absolute; inset: 0;
      width: 100%; height: 100%; padding: 0; margin: 0;
      border: 0; outline: none; background: transparent;
    }
    #fatal {
      display: none; position: absolute; inset: 1rem; color: #b00020;
      font: 14px sans-serif; white-space: pre-wrap; pointer-events: none;
    }
  </style>
</head>
<body>
  <div id="molstar-parent"><canvas id="molstar-canvas"></canvas></div>
  <div id="fatal" role="status"></div>
  <script src="./viewer.js"></script>
</body>
</html>
